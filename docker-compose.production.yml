version: '3.9'

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: 4000
      MONGO_URI: mongodb://mongo:27017/ers
      JWT_SECRET: ${JWT_SECRET}
      STORAGE_PATH: /app/uploads
      AZURE_SPEECH_KEY: ${AZURE_SPEECH_KEY}
      AZURE_SPEECH_REGION: ${AZURE_SPEECH_REGION}
      EVIDENCE_SECRET: ${EVIDENCE_SECRET}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET}
      STUN_SERVERS: ${STUN_SERVERS}
      TURN_SERVER: ${TURN_SERVER}
      TURN_USER: ${TURN_USER}
      TURN_PASS: ${TURN_PASS}
      RELAY_ENABLED: ${RELAY_ENABLED}
      LOCAL_DISCOVERY_ENABLED: ${LOCAL_DISCOVERY_ENABLED}
    volumes:
      - backend-uploads:/app/uploads
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api
        VITE_STUN_SERVERS: ${STUN_SERVERS}
        VITE_TURN_SERVER: ${TURN_SERVER}
        VITE_TURN_USER: ${TURN_USER}
        VITE_TURN_PASS: ${TURN_PASS}
        VITE_RELAY_ENABLED: ${RELAY_ENABLED}
        VITE_LOCAL_DISCOVERY_ENABLED: ${LOCAL_DISCOVERY_ENABLED}
        VITE_LOCAL_DISCOVERY_URL: wss://localhost/discovery
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: /api
      VITE_STUN_SERVERS: ${STUN_SERVERS}
      VITE_TURN_SERVER: ${TURN_SERVER}
      VITE_TURN_USER: ${TURN_USER}
      VITE_TURN_PASS: ${TURN_PASS}
      VITE_RELAY_ENABLED: ${RELAY_ENABLED}
      VITE_LOCAL_DISCOVERY_ENABLED: ${LOCAL_DISCOVERY_ENABLED}
      VITE_LOCAL_DISCOVERY_URL: wss://localhost/discovery

  lan-discovery:
    build:
      context: ./local-discovery
    restart: unless-stopped
    environment:
      LOCAL_DISCOVERY_PORT: 4010
      LOCAL_DISCOVERY_TTL_MS: 15000

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - backend
      - frontend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/ers.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro

volumes:
  mongo-data:
  backend-uploads:
